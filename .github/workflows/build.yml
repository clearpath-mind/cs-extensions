name: Build

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: "src"

      - name: Checkout builds
        id: checkout-builds
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: "builds"
          path: "builds"

      - name: Init builds dir if missing
        if: steps.checkout-builds.outcome == 'failure'
        run: |
          rm -rf "$GITHUB_WORKSPACE/builds"
          mkdir -p "$GITHUB_WORKSPACE/builds"
          cd "$GITHUB_WORKSPACE/builds"
          git init -b builds
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"

      - name: Clean old builds
        run: |
          rm $GITHUB_WORKSPACE/builds/*.cs3 || true
          rm $GITHUB_WORKSPACE/builds/*.jar || true
          rm $GITHUB_WORKSPACE/builds/README.md || true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Access Secrets
        env:
          TMDB_API: ${{ secrets.TMDB_API }}
        run: |
          cd $GITHUB_WORKSPACE/src
          echo TMDB_API=$TMDB_API >> local.properties

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds || true
          cp **/build/*.jar $GITHUB_WORKSPACE/builds || true
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Create repo.json
        run: |
          cat > $GITHUB_WORKSPACE/builds/repo.json <<'EOF'
          {
              "name": "Clearpath-mind Repo",
              "manifestVersion": 1,
              "pluginLists": [
                  "https://raw.githubusercontent.com/clearpath-mind/cs-extensions/builds/plugins.json"
              ]
          }
          EOF

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git checkout -B builds
          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0   # do not error if nothing to commit
          git push --force --set-upstream origin builds
